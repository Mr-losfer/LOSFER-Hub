name: LOSFER Hub Release

# يېڭى tag (v1.2.3) باسقاندا ئاپتوماتىك APK ياساپ Release قا يۈكلەيدۇ
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 21 تەييارلاش
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: pnpm تەييارلاش
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Node تەييارلاش
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: web-ui تاۋارلىرىنى قاچىلاش
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle كەش
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: ئىمزا ھۆججەتلىرىنى تەييارلاش
        run: |
          if [ -n "${{ secrets.KEY_BASE64 }}" ]; then
            echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
            echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
          else
            echo "ئىمزا مەخپىي ئاچقۇچى يوق، تەكشۈرۈش ئىمزاسى ئىشلىتىلىدۇ"
          fi
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
          fi

      - name: Gradle بىلەن ياساش
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleGithubRelease --no-daemon

      - name: Release قا يۈكلەش
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: LOSFER Hub ${{ github.ref_name }}
          body: |
            LOSFER Hub يېڭى نەشرىسى ${{ github.ref_name }}

            - ئاستىدىكى APK نى چۈشۈرۈپ قاچىلاڭ.
          files: |
            app/build/outputs/apk/github/release/*.apk
            app/build/outputs/mapping/githubRelease/mapping.txt
